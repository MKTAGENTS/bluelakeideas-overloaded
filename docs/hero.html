<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overloaded — Hero</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --deep-blue-lake: #005B54;
    --deep-blue-lake-deep: #003D38;
    --kalkaska-mud: #EEF4F3;
    --warm-clay: #A66900;
    --ashes-brindle: #2D2D2D;
    --clarity-white: #FFFFFF;
    --text: #2D2D2D;
    --text-light: #5A5A5A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', -apple-system, sans-serif;
    background: var(--clarity-white);
    color: var(--text);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ─── Hero ─── */
  .hero {
    padding: 5rem 1.5rem 4.5rem;
    text-align: center;
    background: var(--clarity-white);
    max-width: 920px;
    margin: 0 auto;
  }
  .hero .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--deep-blue-lake);
    font-weight: 600;
    margin-bottom: 1.5rem;
  }
  .hero h1 {
    font-family: 'Libre Baskerville', serif;
    font-weight: 700;
    font-size: 4.5rem;
    color: var(--ashes-brindle);
    line-height: 1.02;
    margin-bottom: 0.6rem;
    letter-spacing: -0.015em;
  }
  .hero .subhead {
    font-family: 'Libre Baskerville', serif;
    font-style: italic;
    font-size: 1.35rem;
    color: var(--text-light);
    max-width: 580px;
    margin: 0 auto 0.5rem;
    line-height: 1.4;
  }
  .hero .subhead-logo { margin: 0.4rem auto 1.75rem; }
  .hero .subhead-logo img {
    height: 2.2rem;
    width: auto;
    max-width: 320px;
  }
  .hero .release {
    font-size: 0.85rem;
    color: var(--text-light);
    margin-bottom: 2rem;
    letter-spacing: 0.04em;
  }
  .hero .release strong { color: var(--deep-blue-lake); font-weight: 700; }
  .hero-cta {
    display: inline-block;
    background: var(--deep-blue-lake);
    color: var(--clarity-white);
    padding: 1rem 2rem;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 2px;
    transition: background 0.2s;
  }
  .hero-cta:hover { background: var(--deep-blue-lake-deep); }
  .hero .hero-fineprint {
    font-size: 0.78rem;
    color: var(--text-light);
    margin-top: 1rem;
  }

  @media (max-width: 740px) {
    .hero { padding: 3.5rem 1.25rem 3rem; }
    .hero h1 { font-size: 3rem; }
    .hero .subhead { font-size: 1.1rem; }
  }
  @media (max-width: 420px) {
    .hero h1 { font-size: 2.5rem; }
  }
</style>
</head>
